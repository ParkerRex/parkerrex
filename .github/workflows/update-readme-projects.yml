name: Update README Sections

on:
  schedule:
    - cron: "20 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify token can read private repos
        env:
          GH_TOKEN: ${{ secrets.PROFILE_README_GH_TOKEN || github.token }}
        run: |
          private_count=$(gh repo list ParkerRex --visibility private --limit 1 --json name --jq 'length')
          if [ "$private_count" -eq 0 ]; then
            echo "::error::No private repos are visible to GH_TOKEN. Set PROFILE_README_GH_TOKEN to a PAT with private repo read access."
            exit 1
          fi

      - name: Refresh projects, videos, and blog posts
        env:
          GH_TOKEN: ${{ secrets.PROFILE_README_GH_TOKEN || github.token }}
          YOUTUBE_CHANNEL_ID: UCcuaQecz84wTuxKzr1Yxi4Q
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-readme-projects.mjs --owner ParkerRex --days 30 --exclude parkerrex --exclude jobbi --exclude truemed --readme README.md --require-private-access --youtube-channel-id "$YOUTUBE_CHANNEL_ID" --youtube-count 3 --blog-url "https://www.parkerrex.com/writing" --blog-count 3

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README updates."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh projects, videos, and blog posts"
          git push
