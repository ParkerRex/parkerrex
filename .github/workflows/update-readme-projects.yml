name: Update README Projects

on:
  schedule:
    - cron: "20 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh trailing 30d projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-readme-projects.mjs --owner ParkerRex --days 30 --exclude parkerrex --exclude jobbi --exclude truemed --readme README.md

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README updates."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh trailing 30d projects"
          git push
